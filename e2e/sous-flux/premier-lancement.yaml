appId: fr.depanneo.app
---
# Refus de la localisation si l'appli la demande (ne pas dépendre de la position).
- extendedWaitUntil:
    visible: "(Ne pas autoriser|Refuser|Don.t allow|Deny)"
    timeout: 4000
    optional: true
- tapOn:
    text: "(Ne pas autoriser|Refuser|Don.t allow|Deny)"
    optional: true
# Question du premier lancement (locataire / propriétaire) : absente si déjà répondu.
- extendedWaitUntil:
    visible:
      id: "statut-locataire"
    timeout: 8000
    optional: true
- tapOn:
    id: "statut-locataire"
    optional: true
