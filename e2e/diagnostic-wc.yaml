appId: fr.depanneo.app
---
- launchApp:
    clearState: true
# Refus de la localisation si l'appli la demande (ne pas dépendre de la position).
- tapOn:
    text: "(Ne pas autoriser|Refuser|Don.t allow|Deny)"
    optional: true
- tapOn:
    id: "bouton-diagnostiquer"
- tapOn: "WC bouché"
- assertVisible: "L'eau monte-t-elle dans la cuvette quand tu tires la chasse ?"
- tapOn: "Non, elle descend lentement"
- tapOn: "Non, seulement les WC"
# Verdict vert : « Tu peux réparer ça toi-même »
- assertVisible: "Tu peux réparer ça toi-même"
- tapOn:
    id: "bouton-tuto"
- assertVisible: "Déboucher des WC"
