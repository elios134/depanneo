appId: fr.depanneo.app
---
- launchApp:
    clearState: true
# Refus de la localisation si l'appli la demande (ne pas dépendre de la position).
- tapOn:
    text: "(Ne pas autoriser|Refuser|Don.t allow|Deny)"
    optional: true
- assertVisible:
    id: "bouton-diagnostiquer"
- assertVisible: "Conseils uniquement.*"
- assertNotVisible:
    id: "panneau-replie"
# Replier : l'avertissement et la liste des pros disparaissent, la ligne repliée apparaît
- tapOn:
    id: "poignee-panneau"
- assertVisible:
    id: "panneau-replie"
- assertNotVisible: "Conseils uniquement.*"
- assertNotVisible:
    id: "carte-pro"
# Déplier en touchant la ligne repliée
- tapOn:
    id: "panneau-replie"
- assertNotVisible:
    id: "panneau-replie"
- assertVisible: "Conseils uniquement.*"
