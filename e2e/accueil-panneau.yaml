appId: fr.depanneo.app
---
- launchApp:
    clearState: true
- runFlow: sous-flux/premier-lancement.yaml
- assertVisible:
    id: "bouton-diagnostiquer"
- assertVisible: "Conseils uniquement.*"
- assertNotVisible:
    id: "panneau-replie"
# Replier : l'avertissement et la liste des pros disparaissent, la ligne repliée apparaît
- tapOn:
    id: "poignee-panneau"
- assertVisible:
    id: "panneau-replie"
- assertNotVisible: "Conseils uniquement.*"
# toujours vrai sans position (refusée) ; la règle « pas de pro sur le résultat gaz » est testée par Jest (prosVisibles)
- assertNotVisible:
    id: "carte-pro"
# Déplier en touchant la ligne repliée
- tapOn:
    id: "panneau-replie"
- assertNotVisible:
    id: "panneau-replie"
- assertVisible: "Conseils uniquement.*"
