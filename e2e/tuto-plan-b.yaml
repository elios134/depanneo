appId: fr.depanneo.app
---
- launchApp:
    clearState: true
- runFlow: sous-flux/premier-lancement.yaml
- tapOn:
    id: "onglet-tutos"
- tapOn: "Déboucher des WC"
- assertVisible:
    id: "encadre-tuto"
- assertVisible: "L'eau remonte sans que tu tires la chasse \\?.*"
- scrollUntilVisible:
    element:
      id: "separateur-plan-b"
- assertVisible: "Plan B"
# Première étape du Plan B = étape 4
- scrollUntilVisible:
    element: "Mets des gants et des lunettes.*"
